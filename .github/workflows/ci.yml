name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/fnsh
      - name: Check website catalog and JavaScript
        shell: bash
        run: |
          node --check website/app.js
          node --check website/routes.js
          node --check website/catalog.js
          node scripts/test-website-routes.mjs
          node scripts/website-catalog.mjs --check

  batch-a-acceptance:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
      - name: Test managed media, PDF and image capabilities
        shell: pwsh
        run: ./scripts/test-batch-a.ps1

  table-acceptance:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
      - name: Test managed table capabilities and CLI
        shell: pwsh
        run: ./scripts/test-tables.ps1

  document-acceptance:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
      - name: Test managed document capabilities and CLI
        shell: pwsh
        run: ./scripts/test-documents.ps1

  archive-acceptance:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
      - name: Test managed archive capabilities and CLI
        shell: pwsh
        run: ./scripts/test-archives.ps1

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
      - name: Cross-build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./cmd/fnsh

  minimum-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: true
      - name: Test minimum supported Go version
        run: go test ./...
      - name: Vet minimum supported Go version
        run: go vet ./...
      - name: Build minimum supported Go version
        run: go build ./cmd/fnsh

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: check
