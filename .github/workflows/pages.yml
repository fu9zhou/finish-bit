name: Website / GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Check JavaScript syntax
        run: |
          node --check website/app.js
          node --check website/home.js
      - name: Check website routes
        run: |
          node --check website/routes.js
          node scripts/test-website-routes.mjs
          node scripts/test-website-navigation.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp website/index.html website/styles.css website/home.css website/home.js website/routes.js website/app.js website/catalog.js website/.nojekyll _site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
