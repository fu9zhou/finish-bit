version: 2

project_name: finish-bit

before:
  hooks:
    - go test ./...

builds:
  - id: fnsh
    main: ./cmd/fnsh
    binary: fnsh
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
      - third_party/licenses/**
      - docs/local-tools.md
      - skills/finishbit/**

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  prerelease: auto
